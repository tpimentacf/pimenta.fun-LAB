# Custom origin error pages for www.pimenta.fun.
# Deploy to: /etc/apache2/conf-available/pimenta-error-pages.conf
# Requires:  sudo a2enmod headers rewrite   (Apache 2.4+)
# Include this inside the www.pimenta.fun *:443 <VirtualHost> block.
#
# Two jobs:
#   1. ErrorDocument maps each HTTP error to its styled page under /error/.
#   2. The rewrites below make the /error/errorNNN/ *test* URLs actually
#      return the matching status code FROM THE ORIGIN (not 200), so a direct
#      visit / curl -I shows the real code.
#
# Loop-safety: on a genuine error, Apache issues an internal ErrorDocument
# sub-request to /error/errorNNN/ and sets REDIRECT_STATUS. The RewriteCond
# below only forces the status when REDIRECT_STATUS is empty (the original,
# external request), so the sub-request serves the page instead of recursing.
# `R=4xx/5xx` aborting a request with a status code requires Apache 2.4+.

RewriteEngine On

RewriteCond %{ENV:REDIRECT_STATUS} ^$
RewriteRule ^/error/error403/?$ - [R=403,L]

RewriteCond %{ENV:REDIRECT_STATUS} ^$
RewriteRule ^/error/error404/?$ - [R=404,L]

RewriteCond %{ENV:REDIRECT_STATUS} ^$
RewriteRule ^/error/error406/?$ - [R=406,L]

RewriteCond %{ENV:REDIRECT_STATUS} ^$
RewriteRule ^/error/error502/?$ - [R=502,L]

# Styled pages for each error (also used for real site-wide errors).
ErrorDocument 403 /error/error403/
ErrorDocument 404 /error/error404/
ErrorDocument 406 /error/error406/
ErrorDocument 502 /error/error502/
ErrorDocument 503 /maintenance/
