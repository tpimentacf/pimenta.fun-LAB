# Path-specific cache response headers for the cache labs on www.pimenta.fun.
# Deploy to: /etc/apache2/conf-available/pimenta-cache-headers.conf
# Requires:  sudo a2enmod headers
# Include this inside the www.pimenta.fun *:443 <VirtualHost> block.
#
# Converted from nginx `location { add_header ... }` blocks. Notes:
#   * Apache `Header set` sets a single value (replacing any prior one),
#     which matches the intent of the nginx `add_header` lines here.
#   * Without the `always` keyword, `Header set` applies to successful
#     (2xx/3xx) responses only — the same default scope as nginx
#     `add_header`. Add `always` if you also need them on error responses.
#   * <Location "/path/"> is a URL-prefix match, equivalent to the
#     nginx `location /path/` prefix match.

<IfModule mod_headers.c>

    # Cache Control Override via Workers  ->  /cache/cache-worker/
    <Location "/cache/cache-worker/">
        Header set Cache-Control "max-age=5, stale-while-revalidate=604800"
        # Header set Cache-Control "no-cache"
        Header set Debug-location "cache-worker"
    </Location>

    # Cloudflare-CDN-Cache-Control  ->  /cache/cloudflare-cdn-cache-control/
    <Location "/cache/cloudflare-cdn-cache-control/">
        Header set Cloudflare-CDN-Cache-Control "max-age=24400"
        Header set Cache-Control "max-age=5"
        Header set CDN-Cache-Control "max-age=18000"
        Header set Debug-location "cloudflare-cdn-cache-control"
    </Location>

</IfModule>
