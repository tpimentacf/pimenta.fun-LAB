name = "turnstile-login"
main = "worker.js"
compatibility_date = "2024-09-23"

# Public Turnstile site key (safe to expose in HTML). Default = Cloudflare test
# key that always passes so the demo works with zero config.
[vars]
TURNSTILE_SITEKEY = "1x00000000000000000000AA"  # replace with your real site key
INJECT_SELECTOR = "form"                         # where HTMLRewriter injects the widget

# ---- Demo credentials -------------------------------------------------------
# Lab-only convenience. In a real app NEVER hardcode credentials — use an
# identity provider and hashed secrets. Override these per-environment.
DEMO_USERNAME = "tpimentacf@gmail.com"
DEMO_PASSWORD = "1z1muef2"

# ---- Anti-bypass hardening (all optional; unset = check skipped) ----
# EXPECTED_HOSTNAMES = "www.pimenta.fun"   # token hostname must match one of these
# EXPECTED_ACTION = "login"                # token action must equal this (data-action)
# EXPECTED_CDATA = ""                      # token cdata must equal this (data-cdata)
MAX_TOKEN_AGE_SECONDS = "300"              # reject tokens older than this (freshness)
# BLOCKED_ASNS = "26548,43444,214216,62240"  # hosting/solver ASNs to hard-block
# MIN_BOT_SCORE = "30"                      # block below this Bot Mgmt score (needs BM)
# EPHEMERAL_ID_MAX_USES = "10"              # max solves per device/window (Enterprise + KV)
# EPHEMERAL_ID_WINDOW = "3600"              # ephemeral_id counter window seconds
# FAIL_OPEN = "false"                       # "true" = allow through if siteverify errors

# TURNSTILE_SECRET is a SECRET — do NOT put it here. Default (unset) uses the
# Cloudflare test secret that always passes. For a real key, set it with:
#   npx wrangler secret put TURNSTILE_SECRET
# Local dev: create a .dev.vars file with TURNSTILE_SECRET="..." (git-ignored).

# ---- Replay defense + ephemeral_id counters (optional) ----
# Create the namespace:  npx wrangler kv namespace create TOKEN_REPLAY
# then paste the returned id below and uncomment.
# [[kv_namespaces]]
# binding = "TOKEN_REPLAY"
# id = "<your-kv-namespace-id>"

# Route the Worker on the lab zone. Uncomment to deploy:
# [[routes]]
# pattern = "www.pimenta.fun/turnstile/secure-login*"
# zone_name = "pimenta.fun"
